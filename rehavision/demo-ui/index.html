<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rehavision — 歩行訓練プロジェクション デモ</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">

    <!-- プロジェクターが真上から床に投影している映像。ストーリーボードの意匠に合わせている -->
    <section class="floor" id="floor">

      <h1 class="title">本日の動作①</h1>
      <p class="cue" id="cue">まっすぐ進みましょう</p>

      <!-- 左：歩行を示すピクトグラムと歩数（スライドの配置に合わせている） -->
      <div class="left-col">
        <figure class="walk-icon" aria-hidden="true"></figure>
        <div class="step-count"><b id="step-now">0</b><span>/ 5</span></div>
      </div>

      <!-- 右：進む方向の足跡ガイド。踏むごとに点灯する -->
      <div class="track" aria-hidden="true">
        <div class="arrow"></div>
        <div class="fp l" style="--i:5"></div>
        <div class="fp r" style="--i:4"></div>
        <div class="fp l" style="--i:3"></div>
        <div class="fp r" style="--i:2"></div>
        <div class="fp l" style="--i:1"></div>
      </div>

      <p class="alert" id="alert" hidden><span id="alert-text"></span></p>

    </section>

    <!-- 作業療法士のタブレット -->
    <aside class="panel">
      <div class="patient">
        <span class="patient-name">田中 一郎</span>
        <span class="patient-meta">右大腿骨頸部骨折 術後・回復期</span>
      </div>

      <div class="gauge-block">
        <div class="gauge">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="gauge-bg" cx="60" cy="60" r="52" />
            <circle class="gauge-fg" id="gauge-fg" cx="60" cy="60" r="52" />
          </svg>
          <div class="gauge-value"><b id="gauge-num">0</b><i>/5</i></div>
        </div>
        <span class="gauge-label">本日の歩数</span>
      </div>

      <div class="metric">
        <div class="metric-head">
          <span>歩行安定度</span>
          <b id="stability-num">—</b>
        </div>
        <div class="meter"><i id="stability-bar"></i></div>
      </div>

      <div class="metric">
        <div class="metric-head"><span>1歩ごとの判定</span></div>
        <div class="dots" id="dots">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="metric">
        <div class="metric-head"><span>前回との比較</span></div>
        <div class="bars">
          <div class="bar-row">
            <span class="bar-key">前回</span>
            <div class="bar"><i style="width:60%"></i></div>
            <b class="bar-val">3</b>
          </div>
          <div class="bar-row now">
            <span class="bar-key">本日</span>
            <div class="bar"><i id="bar-today" style="width:0%"></i></div>
            <b class="bar-val" id="bar-today-val">0</b>
          </div>
        </div>
      </div>

      <div class="result" id="result" hidden>
        <span class="result-label">次回目標</span>
        <b class="result-value">7 歩</b>
      </div>

      <div class="controls">
        <button id="start" class="btn">訓練を開始</button>
        <button id="reset" class="btn ghost">リセット</button>
      </div>
    </aside>

  </main>
  <script src="app.js"></script>
</body>
</html>
