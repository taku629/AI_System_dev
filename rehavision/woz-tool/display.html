<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rehavision — ユーザ役用ディスプレイ</title>
        <link rel="stylesheet" href="woz.css" />
    </head>
    <body class="display-body">
        <div class="device-frame">
            <div class="device-header">
                <span class="device-logo"
                    >Reha<span class="accent">Vision</span></span
                >
                <span class="device-status" id="device-status">待機中</span>
            </div>

            <div class="device-screen" id="device-screen">
                <div class="idle-view" id="idle-view">
                    <div class="mic-icon" aria-hidden="true">
                        <svg
                            viewBox="0 0 24 24"
                            width="56"
                            height="56"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="9" y="2" width="6" height="12" rx="3" />
                            <path d="M5 10a7 7 0 0 0 14 0" />
                            <line x1="12" y1="17" x2="12" y2="22" />
                        </svg>
                    </div>
                    <p class="idle-text">タップして話す</p>
                </div>

                <div class="thinking-view" id="thinking-view" hidden>
                    <div class="dots" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </div>
                    <p class="thinking-text">確認しています…</p>
                </div>

                <div class="answer-view" id="answer-view" hidden>
                    <p class="answer-text" id="answer-text"></p>
                </div>
            </div>
        </div>

        <script src="display.js"></script>
    </body>
</html>
