<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rehavision WOZ — オペレータ卓</title>
<link rel="stylesheet" href="woz.css" />
</head>
<body class="operator-body">
  <header class="op-header">
    <div>
      <span class="op-title">Rehavision WOZ オペレータ卓</span>
      <span class="op-note">この画面はユーザ役に見せないこと</span>
    </div>
    <div class="op-header-actions">
      <span class="link-status" id="link-status">ディスプレイ未接続</span>
      <button class="btn btn-ghost" id="open-display-btn">ユーザ役用ディスプレイを開く</button>
    </div>
  </header>

  <main class="op-main">
    <section class="panel phrases-panel">
      <h2 class="panel-title">頻出フレーズ</h2>
      <p class="panel-hint">クリックで下の応答欄に追加されます。内容は <code>phrases.js</code> で編集。</p>
      <div id="phrase-groups"></div>
    </section>

    <section class="panel compose-panel">
      <h2 class="panel-title">応答を送る</h2>

      <div class="quick-actions">
        <button class="btn btn-ghost" id="thinking-btn">「確認しています…」を表示</button>
        <button class="btn btn-ghost" id="idle-btn">待機画面に戻す</button>
      </div>

      <label class="field-label" for="answer-input">応答文（ユーザ役に表示・読み上げ）</label>
      <textarea id="answer-input" class="answer-input" rows="4"
                placeholder="頻出フレーズをクリックするか、ここに直接入力"></textarea>

      <div class="compose-row">
        <div class="field">
          <label class="field-label" for="category-select">カテゴリ</label>
          <select id="category-select" class="select"></select>
        </div>
        <div class="field field-grow">
          <label class="field-label" for="question-input">ユーザ役の質問（後から入力してもOK）</label>
          <input id="question-input" class="text-input" type="text"
                 placeholder="聞き取れた範囲でメモ。あとで表を編集できます" />
        </div>
      </div>

      <div class="send-row">
        <button class="btn btn-primary" id="send-btn">送信して読み上げ（Ctrl+Enter）</button>
        <label class="checkbox">
          <input type="checkbox" id="speak-toggle" checked />
          読み上げる
        </label>
        <label class="checkbox">
          音声
          <select id="voice-select" class="select select-sm"></select>
        </label>
      </div>
      <p class="tts-note" id="tts-note"></p>
    </section>

    <section class="panel log-panel">
      <div class="log-head">
        <h2 class="panel-title">対話コーパス（<span id="log-count">0</span>件）</h2>
        <div class="log-actions">
          <button class="btn btn-ghost" id="export-csv-btn">CSV出力</button>
          <button class="btn btn-ghost" id="export-json-btn">JSON保存</button>
          <button class="btn btn-ghost" id="import-json-btn">JSON読込</button>
          <input type="file" id="import-file" accept="application/json" hidden />
          <button class="btn btn-danger-ghost" id="clear-log-btn">全消去</button>
        </div>
      </div>
      <p class="panel-hint">質問・応答・カテゴリの各セルは直接編集できます（収録後の書き起こしに使用）。</p>
      <div class="table-scroll">
        <table class="log-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-time">時刻</th>
              <th>Users' Question</th>
              <th>Answers</th>
              <th class="col-cat">カテゴリ</th>
              <th class="col-del"></th>
            </tr>
          </thead>
          <tbody id="log-body">
            <tr class="empty-row"><td colspan="6">まだ記録がありません。応答を送信すると1行ずつ追加されます。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="phrases.js"></script>
  <script src="operator.js"></script>
</body>
</html>
