<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WOZ オペレータ卓</title>
<link rel="stylesheet" href="woz.css" />
</head>
<body class="operator-body">

  <header class="topbar">
    <span class="tb-title">WOZ<b>オペレータ卓</b></span>
    <span class="tb-warn">ユーザ役に見せない画面</span>
    <span class="spacer"></span>
    <span class="link-status" id="link-status">未接続</span>
    <button class="btn ghost" id="open-display-btn">ディスプレイを開く</button>
  </header>

  <main class="op-main">

    <section class="phrases">
      <div id="phrase-groups"></div>
    </section>

    <section class="compose">
      <textarea id="answer-input" class="answer-input" rows="5"
                placeholder="フレーズをクリック、またはここに入力"></textarea>

      <div class="row">
        <select id="category-select" class="select"></select>
        <input id="question-input" class="text-input" type="text"
               placeholder="ユーザ役の質問（あとで表から編集可）" />
      </div>

      <div class="row send-row">
        <button class="btn dim" id="thinking-btn">確認中…</button>
        <button class="btn dim" id="idle-btn">待機</button>
        <button class="btn primary" id="send-btn">送信 <kbd>⌃⏎</kbd></button>
      </div>

      <div class="row audio-row">
        <label class="chk"><input type="checkbox" id="speak-toggle" checked /> 読み上げ</label>
        <select id="voice-select" class="select sm"></select>
        <span class="tts-note" id="tts-note"></span>
      </div>
    </section>

    <section class="log">
      <div class="log-bar">
        <span class="log-count">コーパス <b id="log-count">0</b></span>
        <span class="spacer"></span>
        <button class="btn ghost sm" id="export-csv-btn">CSV</button>
        <button class="btn ghost sm" id="export-json-btn">保存</button>
        <button class="btn ghost sm" id="import-json-btn">読込</button>
        <input type="file" id="import-file" accept="application/json" hidden />
        <button class="btn danger sm" id="clear-log-btn">消去</button>
      </div>

      <div class="table-scroll">
        <table class="log-table">
          <thead>
            <tr>
              <th class="col-id">#</th>
              <th class="col-time">時刻</th>
              <th>質問</th>
              <th>応答</th>
              <th class="col-cat">カテゴリ</th>
              <th class="col-del"></th>
            </tr>
          </thead>
          <tbody id="log-body">
            <tr class="empty-row"><td colspan="6">送信すると1行ずつ記録されます</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="phrases.js"></script>
  <script src="operator.js"></script>
</body>
</html>
