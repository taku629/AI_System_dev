<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RehaVision</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #070b18;
    color: #fff;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    padding: 6vh 8vw;
  }

  .wrap { width: min(620px, 100%); }

  h1 {
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1;
  }
  h1 span { color: #5eead4; }

  .lead {
    margin-top: .9rem;
    font-size: .98rem;
    color: #8894a8;
    letter-spacing: .04em;
  }

  nav { margin-top: 3.4rem; }

  a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.15rem .2rem;
    border-top: 1px solid #1b2438;
    color: #fff;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    transition: color .15s ease, padding-left .15s ease;
  }
  a:last-of-type { border-bottom: 1px solid #1b2438; }
  a:hover { color: #5eead4; padding-left: .7rem; }

  a::after {
    content: "→";
    color: #46536b;
    transition: transform .15s ease, color .15s ease;
  }
  a:hover::after { color: #5eead4; transform: translateX(5px); }

  footer {
    margin-top: 3.4rem;
    font-size: .78rem;
    color: #46536b;
    line-height: 1.9;
  }

  /* 背景：デモと同じ床面投影を薄く敷く */
  .beam {
    position: fixed;
    right: 4vw;
    top: 0;
    width: 38vw;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(247,233,196,.07), rgba(247,233,196,.015) 55%, transparent 78%);
    clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
  }

  .beam i {
    position: absolute;
    left: 50%;
    border-radius: 50% 50% 42% 42%;
    border: 1px solid rgba(94,234,212,.22);
    background: rgba(94,234,212,.04);
  }
  .beam i:nth-child(1) { bottom: 14%; width: 26px; height: 38px; transform: translateX(-50%) translateX(-38px); }
  .beam i:nth-child(2) { bottom: 30%; width: 23px; height: 34px; transform: translateX(-50%) translateX(30px); }
  .beam i:nth-child(3) { bottom: 46%; width: 20px; height: 30px; transform: translateX(-50%) translateX(-24px); }
  .beam i:nth-child(4) { bottom: 62%; width: 17px; height: 26px; transform: translateX(-50%) translateX(18px); }

  @media (max-width: 860px) { .beam { display: none; } }
</style>
</head>
<body>
  <div class="beam" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="wrap">
    <h1>Reha<span>Vision</span></h1>
    <p class="lead">理学療法士の新たな可能性</p>

    <nav>
      <a href="rehavision/demo-ui/">歩行訓練デモ</a>
      <a href="rehavision/ai-demo/">AI対話デモ</a>
      <a href="rehavision/woz-tool/operator.html">
              WOZ対話収録ツール（補助・オペレータ操作型）
      </a>
    </nav>

    <footer>
      人工知能システム開発 第7班<br />
      メインデモ：歩行訓練 /AI対話<br />
      ※WOZは対話データ収集用の補助ツールです<br />
      ※AI対話デモは Gemini APIキーが必要
    </footer>
  </div>
</body>
</html>
